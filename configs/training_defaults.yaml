# Neutral shared defaults for segmentation training and event-level model selection.
# Choose the model initialisation with --weights-source and the channels with
# --input-modalities / --modality-sets. Individual runs save a resolved config.yaml.
seed: 42
image_size: 512
trainer:
  cpu: false
  amp: false
  amp_full_precision_retry: true
  progress_bar: true
  progress_log_interval: 0
  progress_label: FloodSegmentation
  batch_size: 8
  num_workers: 2
  max_epochs: 30
  train_metrics:
  - iou
  val_metrics:
  - f1
  - iou
  - mcc
  - precision
  - recall
  monitor: f1
  patience: 10
  validate_every: 1
  save_last: true
  save_epoch_checkpoints: false
  grad_clip_norm: 1.0
  detect_anomaly: false
  skip_nonfinite_batches: true
  max_skipped_batch_fraction: 0.0
  threshold_sweep: true
  thresholds:
  - 0.10
  - 0.20
  - 0.30
  - 0.40
  - 0.50
  - 0.60
  - 0.70
  - 0.80
  - 0.90
  threshold_metric: f1
  monitor_threshold_sweep: true
  metric_mode: global
  event_macro_validation: false
  group_dro: false
data:
  path: ''
  train_source_split: train
  val_source_split: val
  in_channels: 2
  include_dem: false
  input_modalities:
  - vv
  - vh
  class_weights: null
  mask_body_ratio: 0.0
  train_mask_body_ratio: 0.0
  val_mask_body_ratio: 0.0
  test_mask_body_ratio: 0.0
  weighted_sampling: false
  foreground_balanced_sampling: false
  stratified_sampling: false
  event_balanced_sampling: false
  hard_example_sampling: false
  hard_positive_region_sampling: false
  hard_negative_region_sampling: false
  sparse_crop_supervision: false
  modality_dropout: false
  augmentation_profile: composite
  disable_random_crop: false
  disable_elastic: false
  disable_grid_distortion: false
  disable_sar_noise: false
  normalization_stats_path: null
  normalization_mode: robust_percentile
  source_sar_transform: auto
  pos_weight_from_train: true
  pos_weight_max: 20.0
  cache_dir: outputs/cache
  clear_cache: false
model:
  # These are safe scratch defaults only. --weights-source resolves registered
  # ImageNet/EO providers, their compatible encoder/decoder, and normalisation.
  weights_source: random
  encoder: resnet34
  decoder: unet
  pretrained: false
  freeze: false
  multibranch: false
  output_stride: 16
  act: relu
  norm: std
  dropout2d: false
  transforms: ''
  foundation_input_size: 224
  foundation_pyramid_channels: 256
loss:
  target: bce_tversky
  alpha: 0.3
  beta: 0.7
  gamma: 1.0
  focal_gamma: 2.0
  focal_alpha: 1.0
  bce_weight: 0.5
  focal_weight: 0.5
  tversky_weight: 0.5
  reduction: mean
optimizer:
  target: adam
  lr: 0.0001
  encoder_lr: 0.0001
  decoder_lr: 0.0001
  momentum: 0.9
  weight_decay: 0.0001
scheduler:
  target: poly
debug: false
name: null
output_folder: outputs
num_samples: 8
visualize: false
comment: neutral-training-defaults
version: ''
init_checkpoint: null
resume: false
resume_from: null
