seed: 42
image_size: 256
trainer:
  cpu: false
  amp: true
  progress_bar: true
  progress_log_interval: 0
  progress_label: FloodSegmentation
  batch_size: 16
  num_workers: 4
  max_epochs: 30
  train_metrics:
  - iou
  val_metrics:
  - f1
  - iou
  - mcc
  - precision
  - recall
  monitor: f1
  patience: 7
  validate_every: 1
  save_last: true
  save_epoch_checkpoints: false
  temperature: 2.0
  temp_epochs: 20
  grad_clip_norm: 1.0
  detect_anomaly: false
  skip_nonfinite_batches: true
  threshold_sweep: true
  thresholds:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.6
  - 0.7
  threshold_metric: f1
  monitor_threshold_sweep: true
  metric_mode: both
data:
  path: ''
  in_channels: 3
  include_dem: true
  class_weights: null
  mask_body_ratio: 0.0
  train_mask_body_ratio: 0.0
  val_mask_body_ratio: 0.0
  test_mask_body_ratio: 0.0
  weighted_sampling: false
  foreground_balanced_sampling: false
  foreground_sample_ratio: 0.65
  foreground_min_ratio: 0.0
  weighted_samples_multiplier: 1.0
  sample_smoothing: 0.8
  augmentation_profile: composite
  disable_random_crop: false
  disable_elastic: false
  disable_grid_distortion: false
  disable_sar_noise: false
  sparse_crop_supervision: false
  sparse_crop_normal_fraction: 0.5
  sparse_crop_flood_fraction: 0.25
  sparse_crop_hard_background_fraction: 0.25
  sparse_crop_sizes:
  - 256
  - 320
  - 384
  - 448
  sparse_crop_attempts: 24
  sparse_crop_hard_background_max_fg_ratio: 0.001
  sparse_crop_min_valid_ratio: 0.5
  hard_negative_region_sampling: false
  hard_negative_manifest: null
  hard_negative_region_weight: 4.0
  hard_negative_region_max_fraction: 0.35
  hard_negative_crop_probability: 1.0
  normalization_stats_path: null
  normalization_mode: robust_percentile
  modality_dropout: false
  modality_dropout_prob: 0.0
  drop_modalities:
  - dem
  stratified_sampling: false
  event_balanced_sampling: true
  pos_weight_from_train: true
  pos_weight_max: 20.0
  fg_bin_edges:
  - 0.0
  - 0.005
  - 0.02
  - 0.1
  fg_bin_sample_weights:
  - 0.2
  - 0.2
  - 0.25
  - 0.25
  - 0.1
  cache_dir: outputs/cache
  clear_cache: false
model:
  encoder: resnet34
  decoder: unet
  pretrained: true
  freeze: false
  multibranch: false
  output_stride: 16
  act: relu
  norm: std
  dropout2d: false
  transforms: ''
loss:
  target: bce_tversky
  alpha: 0.3
  beta: 0.7
  gamma: 1.0
  focal_gamma: 2.0
  focal_alpha: 1.0
  bce_weight: 0.5
  focal_weight: 0.5
  tversky_weight: 0.5
  reduction: mean
optimizer:
  target: adam
  lr: 0.0001
  encoder_lr: 0.0001
  decoder_lr: 0.0001
  momentum: 0.9
  weight_decay: 0.0001
scheduler:
  target: poly
debug: false
name: null
output_folder: outputs
num_samples: 8
visualize: false
comment: unet-resnet34-vv-vh-dem-bce-tversky-event-balanced
version: ''
resume: false
resume_from: null
