model:
  encoder: resnet34
  decoder: unet
  pretrained: true
  freeze: false
  multibranch: false
  output_stride: 16
  act: relu
  norm: std
  dropout2d: false
  transforms: "CallableCompose(HorizontalFlip(p=0.5), VerticalFlip(p=0.5), RandomRotate90(p=0.5),\
    \ ElasticTransform(p=0.2, alpha=1.0, approximate=False, border_mode=0, fill=0.0,\
    \ fill_mask=0.0, interpolation=1, keypoint_remapping_method='mask', mask_interpolation=0,\
    \ noise_distribution='gaussian', same_dxdy=False, sigma=50.0), GridDistortion(p=0.2,\
    \ border_mode=0, distort_limit=(-0.3, 0.3), fill=0.0, fill_mask=0.0, interpolation=1,\
    \ keypoint_remapping_method='mask', mask_interpolation=0, normalized=True, num_steps=5),\
    \ Rotate(p=0.5, border_mode=0, crop_border=False, fill=0.0, fill_mask=0.0, interpolation=1,\
    \ limit=(-30.0, 30.0), mask_interpolation=0, rotate_method='largest_box'), OneOf([\n\
    \  GaussianBlur(p=0.5, blur_limit=(3, 7), sigma_limit=(0.5, 3.0)),\n  RandomBrightnessContrast(p=0.2,\
    \ brightness_by_max=True, brightness_limit=(-0.2, 0.2), contrast_limit=(-0.2,\
    \ 0.2), ensure_safe_range=False),\n  CoarseDropout(p=1.0, fill=0.0, fill_mask=None,\
    \ hole_height_range=(0.1, 0.25), hole_width_range=(0.1, 0.25), num_holes_range=(1,\
    \ 8)),\n], p=0.5))Compose([\n], p=1.0, bbox_params=None, keypoint_params=None,\
    \ additional_targets={}, is_check_shapes=True)Compose([\n], p=1.0, bbox_params=None,\
    \ keypoint_params=None, additional_targets={}, is_check_shapes=True)"
loss:
  target: bce_tversky
  alpha: 0.3
  beta: 0.7
  gamma: 1.0
  focal_gamma: 2.0
  focal_alpha: 1.0
  bce_weight: 0.5
  focal_weight: 0.5
  tversky_weight: 0.5
  reduction: mean
